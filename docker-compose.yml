name: owasp-rag-assistant

services:
  ollama:
    image: ollama/ollama:0.5.7
    volumes:
      - ollama-models:/root/.ollama
    # No se publica el puerto al host: solo la API habla con el modelo.
    expose:
      - "11434"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Descarga los modelos la primera vez y termina.
  model-loader:
    image: ollama/ollama:0.5.7
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull ${LLM_MODEL:-llama3.2:3b} &&
       ollama pull ${EMBEDDING_MODEL:-nomic-embed-text} &&
       echo 'modelos listos'"
    networks:
      - backend
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: owasp-rag-assistant:1.0.0
    depends_on:
      model-loader:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_PATH: /data/chroma
      CORPUS_PATH: /data/corpus
      USERS_FILE: /run/config/users.json
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - api-index:/data/chroma
      - ./data/corpus:/data/corpus:ro
      - ./config/users.json:/run/config/users.json:ro
    networks:
      - backend
    # --- Hardening de runtime ---
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 200
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  ollama-models:
  api-index:
