name: owasp-rag-assistant

services:
  # Es el servicio que corre inferencia sobre texto que viene del usuario, asi que
  # lleva los mismos controles que la API. Se endurecio despues de una revision que
  # noto que era el unico contenedor del stack sin ninguno.
  ollama:
    # Imagen propia sobre la oficial: solo crea /home/ollama/.ollama con el owner
    # correcto. Sin eso, el named volume vacio nace propiedad de root y el proceso
    # como 10001 no puede escribir su clave —permission denied en bucle— en un clon
    # limpio sobre Linux o Mac. El detalle esta en Dockerfile.ollama.
    build:
      context: .
      dockerfile: Dockerfile.ollama
    image: owasp-rag-ollama:0.5.7
    # El HOME se mueve para que un usuario sin privilegios pueda escribir su propio
    # directorio de modelos: el UID coincide con el de la API para que los permisos
    # del volumen sean predecibles.
    user: "10001:10001"
    environment:
      HOME: /home/ollama
    volumes:
      - ollama-models:/home/ollama/.ollama
    # No se publica el puerto al host: solo la API habla con el modelo.
    expose:
      - "11434"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # --- Hardening de runtime ---
    # Es el servicio que corre inferencia sobre texto que viene del usuario, y era
    # el unico contenedor del stack sin ningun control. Lleva los mismos que la API.
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Con los dos modelos cargados en RAM el consumo medido es de 3,7 GB. El tope
    # deja margen para la inferencia sin permitir que se lleve el host entero.
    mem_limit: 6g
    # El tope de CPU estaba en 8.0, y Docker rechaza el arranque cuando el limite
    # supera la cantidad de nucleos de la maquina: un equipo con menos de 8 cores no
    # podia levantar el contenedor. Se baja a 2.0, que cabe en cualquier maquina y
    # sigue acotando el uso. La inferencia es mas lenta con menos nucleos, pero
    # funciona; para exprimir un host grande se puede subir.
    cpus: 2.0
    # Mas alto que el de la API porque Ollama levanta un proceso runner por modelo.
    pids_limit: 512
    restart: unless-stopped

  # Descarga los modelos la primera vez y termina.
  model-loader:
    image: ollama/ollama:0.5.7
    depends_on:
      ollama:
        condition: service_healthy
    user: "10001:10001"
    environment:
      OLLAMA_HOST: http://ollama:11434
      HOME: /tmp
    # Los nombres de modelo llegan como argumentos posicionales, no interpolados
    # dentro de la cadena que ejecuta el shell. Con la interpolacion, quien pudiera
    # editar el .env elegia el comando que corria este contenedor.
    entrypoint: ["/bin/sh", "-c", 'ollama pull "$1" && ollama pull "$2" && echo "modelos listos"', "--"]
    command:
      - "${LLM_MODEL:-llama3.2:3b}"
      - "${EMBEDDING_MODEL:-nomic-embed-text}"
    networks:
      - backend
    # --- Hardening de runtime ---
    # No monta el volumen de modelos: descarga a traves de OLLAMA_HOST, asi que solo
    # necesita un directorio temporal propio.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: owasp-rag-assistant:1.0.0
    depends_on:
      model-loader:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_PATH: /data/chroma
      CORPUS_PATH: /data/corpus
      USERS_FILE: /run/config/users.json
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - api-index:/data/chroma
      - ./data/corpus:/data/corpus:ro
      - ./config/users.json:/run/config/users.json:ro
    networks:
      - backend
    # --- Hardening de runtime ---
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 200
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  ollama-models:
  api-index:
